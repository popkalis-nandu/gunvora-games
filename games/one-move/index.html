<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffb36b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="ONE MOVE: 150 brain puzzles. Every level gives you exactly one move. Matchsticks, sliding crates, bouncing balls and daring rescues.">
<title>ONE MOVE · one move, one chance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/logo.png" as="image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- BALA HR start-up splash (self-contained; tap or any key skips) -->
<style>
#bhSplash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;background:radial-gradient(ellipse at center,#1d2a4a 0%,#0a0f1f 55%,#05070d 100%);opacity:1;transition:opacity .6s ease;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#bhSplash.out{opacity:0;pointer-events:none}
#bhSplash img{display:block;max-width:70vw;max-height:70vh;max-height:70dvh;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 0 3vmin rgba(255,170,40,.35));opacity:0;transform:scale(.86);transition:opacity .7s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
#bhSplash.in img{opacity:1;transform:scale(1)}
#bhSplash p{margin:0;font:600 clamp(11px,2.4vmin,16px)/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#c9d3ea;opacity:0;transition:opacity .8s ease .4s}
#bhSplash.in p{opacity:.8}
@media (prefers-reduced-motion:reduce){#bhSplash img{transform:none;transition:opacity .3s}}
</style>
<div id="bhSplash" role="img" aria-label="Presented by BALA HR (@popkalis). Tap to skip."><img id="bhSplashImg" src="assets/logo.png" alt="BALA HR @popkalis logo" width="560" height="542" decoding="async"><p>Presented by BALA HR</p></div>
<script>
(function(){
  var s=document.getElementById('bhSplash'),img=document.getElementById('bhSplashImg'),done=false,shown=false,t1,t2;
  if(!s)return;
  function end(fast){
    if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);
    s.classList.add('out');
    setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);window.dispatchEvent(new Event('bhsplashdone'));},fast?150:650);
    document.removeEventListener('keydown',onKey,true);
  }
  function onKey(e){if(e.key==="Tab")return;e.preventDefault();e.stopPropagation();end();}
  function show(){
    if(shown||done)return;shown=true;
    requestAnimationFrame(function(){s.classList.add('in');});
    t1=setTimeout(end,2500);
  }
  // click (not pointerdown) so the tap is consumed by the splash and does not hit menu buttons underneath
  s.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();end();});
  document.addEventListener('keydown',onKey,true);
  img.addEventListener('error',function(){end(true);});
  if(img.complete&&img.naturalWidth)show();else img.addEventListener('load',show);
  t2=setTimeout(function(){if(!shown)end(true);},2000); // image too slow: skip
  window.__bhSplash={end:end};
})();
</script>
<div id="app">
  <!-- HOME -->
  <section id="scrHome" class="scr on">
    <div class="topbar"><span class="grow"></span><button class="pill coins" data-act="shop" aria-label="Coins"><span class="coin"></span><b class="coinAmt">0</b></button><button class="icon" data-act="settings" aria-label="Settings">⚙️</button></div>
    <div class="home">
      <div class="logo" aria-label="ONE MOVE"><span class="l1">ONE</span><span class="l2">MOVE</span></div>
      <p class="tag">One move. One chance. <b id="lvTotal">150</b> puzzles.</p>
      <div class="types"><span>🔥<small>Matchsticks</small></span><span>📦<small>Slide</small></span><span>🎯<small>Bounce</small></span><span>🧗<small>Rescue</small></span></div>
      <div class="hbtns">
        <button class="big primary" data-act="continue"><b id="contTitle">Play</b><small id="contSub">Level 1</small></button>
        <button class="big" data-act="map"><b>🗺️ Levels</b><small id="starSum">0 ★</small></button>
        <button class="big gold" data-act="daily" id="btnDaily"><b>🎁 Daily bonus</b><small id="dailySub">+40 coins</small></button>
        <div class="hrow">
          <button class="mid" data-act="shop">🎨 Themes</button>
          <button class="mid" data-act="howto">❓ How to play</button>
        </div>
      </div>
      <p class="fine">Coins are free game points with no cash value. No ads, no sign-up, nothing leaves your phone.<br>Presented by BALA HR</p>
    </div>
  </section>
  <!-- MAP -->
  <section id="scrMap" class="scr">
    <div class="topbar"><button class="icon" data-act="home" aria-label="Back">‹</button><b class="ttl">Levels</b><span class="grow"></span><button class="pill coins" data-act="shop"><span class="coin"></span><b class="coinAmt">0</b></button></div>
    <div id="mapList" class="maplist"></div>
  </section>
  <!-- GAME -->
  <section id="scrGame" class="scr">
    <div class="topbar"><button class="icon" data-act="map" aria-label="Back to levels">‹</button><b class="ttl" id="gTitle">Level 1</b><span class="grow"></span><button class="pill coins" data-act="shop"><span class="coin"></span><b class="coinAmt">0</b></button></div>
    <div id="gBody">
      <div id="gInfo"><div id="gType"></div><div id="gPrompt"></div><div id="gTip" hidden></div></div>
      <div id="stage"><canvas id="cv" aria-label="Puzzle board"></canvas><div id="gMsg" aria-live="polite"></div></div>
      <div id="gBtns">
        <button id="bRetry" class="act" aria-label="Retry">↺<span>Retry</span></button>
        <button id="bHint" class="act" aria-label="Hint">💡<span>Hint</span><em><i class="coin"></i>20</em></button>
      </div>
    </div>
  </section>
  <!-- RESULT -->
  <div id="ovResult" class="ov" hidden>
    <div class="rcard" id="rCard">
      <div class="rtitle" id="rTitle">Solved!</div>
      <div class="stars" id="rStars"><i>★</i><i>★</i><i>★</i></div>
      <div class="rsub" id="rSub"></div>
      <div class="rbtns" id="rBtns"></div>
    </div>
  </div>
  <!-- MODAL -->
  <div id="ovModal" class="ov" hidden><div class="mcard"><button class="mclose icon" data-act="closeModal" aria-label="Close">✕</button><div id="mBody"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
