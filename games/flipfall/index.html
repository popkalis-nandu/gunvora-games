<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0820">
<title>FLIPFALL</title>
<style>
html{--sal:env(safe-area-inset-left,0px);--sat:env(safe-area-inset-top,0px)}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0820;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none;outline:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---------- constants (logical units; corridor is 600 tall) ----------
var H=600,CEIL=60,FLOOR=540,PS=34,G=6500,VMAX=1500,KICK=320,SPW=34;
var FONT='system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
var W=800,scale=1,oy=0,dpr=1,cw=0,ch=0,safeL=0,safeT=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cw=window.innerWidth;ch=window.innerHeight;
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  scale=Math.min(ch/H,cw/700);       // keep >=700 units of look-ahead even in portrait
  W=cw/scale;oy=(ch-H*scale)/2;
  try{var cs=getComputedStyle(document.documentElement);safeL=parseFloat(cs.getPropertyValue('--sal'))||0;safeT=parseFloat(cs.getPropertyValue('--sat'))||0;}catch(e){safeL=safeT=0;}
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,100);});
resize();

// ---------- storage ----------
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
var best=store.get('flipfall_best',0)|0;
var skinIdx=store.get('flipfall_skin',0)|0;
var muted=!!store.get('flipfall_muted',false);

var SKINS=[
  {name:'NEON', need:0,  col:'#3ef2ff',dark:'#0a5a78'},
  {name:'EMBER',need:25, col:'#ff7a2e',dark:'#8a1d08'},
  {name:'TOXIC',need:75, col:'#9dff3a',dark:'#2c6b0c'},
  {name:'PRISM',need:150,col:'rainbow',dark:'#3a1a6b'}
];
function unlocked(i){return best>=SKINS[i].need;}
if(!(skinIdx>=0&&skinIdx<SKINS.length)||!unlocked(skinIdx))skinIdx=0;
function skinCol(i,off){var s=SKINS[i];return s.col==='rainbow'?'hsl('+(((t*140+(off||0))%360+360)%360)+',100%,62%)':s.col;}

// ---------- audio (tiny synth, starts on first gesture) ----------
var actx=null;
function beep(f,d,type,vol,slide){
  if(muted)return;
  try{
    if(!actx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;actx=new A();}
    if(actx.state==='suspended')actx.resume();
    var now=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,now);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),now+d);
    g.gain.setValueAtTime(vol||0.04,now);g.gain.exponentialRampToValueAtTime(0.0001,now+d);
    o.connect(g);g.connect(actx.destination);o.start(now);o.stop(now+d+0.02);
  }catch(e){}
}

// ---------- state ----------
var state='menu',t=0,camX=0,speed=330,score=0,deadAt=0,shake=0,flash=0,newBest=false;
var obs=[],parts=[],trail=[],nextX=0,toast=null,runBestBefore=0,announced={},demoFlip=0,boxWiggle=[0,0,0,0];
var P={y:FLOOR-PS,vy:0,g:1,grounded:true,vis:1,sx:1,sy:1,coyote:0,buffer:0,tilt:0};

function px(){return Math.max(90,Math.min(W*0.26,260));}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){
  camX=0;speed=330;score=0;obs=[];trail=[];nextX=W+250;toast=null;announced={};newBest=false;
  P.y=FLOOR-PS;P.vy=0;P.g=1;P.grounded=true;P.vis=1;P.sx=1;P.sy=1;P.coyote=0;P.buffer=0;P.tilt=0;
  runBestBefore=best;
}
function start(){reset();state='play';beep(520,0.08,'square',0.04,300);}

// ---------- world generation ----------
function wallTop(o){return CEIL+((FLOOR-CEIL)-o.h)*(0.5+0.5*Math.sin(t*o.f+o.ph));}
function solidAt(side,x0,x1){
  for(var i=0;i<obs.length;i++){var o=obs[i];
    if(o.type==='gap'&&o.side===side&&x0>=o.x&&x1<=o.x+o.w)return false;}
  return true;
}
function spawn(){
  var sc=nextX/40,diff=Math.min(1,sc/300),minGap=speed*0.62+80,x=nextX,end;
  var side=Math.random()<0.5?'floor':'ceil',other=side==='floor'?'ceil':'floor';
  var avail=['spike','spike'];
  if(sc>=12)avail.push('gap');
  if(sc>=30)avail.push('wall');
  if(sc>=55)avail.push('double');
  if(sc>=90)avail.push('gapspike');
  var type=avail[(Math.random()*avail.length)|0],n,n2,w,x2;
  if(type==='spike'){n=1+((Math.random()*Math.min(4,1+sc/35))|0);obs.push({type:'spike',x:x,side:side,n:n,w:n*SPW});end=x+n*SPW;}
  else if(type==='gap'){w=90+Math.random()*60+diff*70;obs.push({type:'gap',x:x,side:side,w:w});end=x+w;}
  else if(type==='wall'){obs.push({type:'wall',x:x,w:46,h:220,ph:Math.random()*6.283,f:1.8+Math.random()*0.8+diff*0.8});end=x+46;}
  else if(type==='double'){
    n=1+((Math.random()*2)|0);obs.push({type:'spike',x:x,side:side,n:n,w:n*SPW});
    x2=x+n*SPW+speed*0.6+60;n2=1+((Math.random()*2)|0);obs.push({type:'spike',x:x2,side:other,n:n2,w:n2*SPW});end=x2+n2*SPW;
  } else {
    w=100+Math.random()*50;obs.push({type:'gap',x:x,side:side,w:w});
    x2=x+w+speed*0.6+60;n2=1+((Math.random()*2)|0);obs.push({type:'spike',x:x2,side:other,n:n2,w:n2*SPW});end=x2+n2*SPW;
  }
  nextX=end+minGap+Math.random()*speed*(0.9-diff*0.5);
}

// ---------- particles ----------
function burst(x,y,n,col,spd,life,grav,size){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=spd*(0.3+Math.random()*0.7);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(0.5+Math.random()*0.5),max:life,col:col,size:size*(0.5+Math.random()*0.8),g:grav});}
}

// ---------- player ----------
function flip(){
  if(P.grounded||P.coyote>0){
    P.g*=-1;P.grounded=false;P.coyote=0;P.buffer=0;P.vy=KICK*P.g;P.sx=0.7;P.sy=1.35;
    var wx=camX+px()+PS/2,sy=P.g>0?CEIL:FLOOR;
    burst(wx,sy,8,skinCol(skinIdx),220,0.35,0,4);
    beep(P.g>0?380:620,0.07,'square',0.03,P.g>0?-120:200);
  } else P.buffer=0.14;
}
function land(y){
  P.y=y;P.vy=0;P.grounded=true;P.sx=1.4;P.sy=0.65;
  var wx=camX+px()+PS/2,sy=P.g>0?FLOOR:CEIL;
  for(var i=0;i<7;i++)parts.push({x:wx+(Math.random()-0.5)*PS,y:sy,vx:-80-Math.random()*160,vy:(Math.random()*-120)*P.g,life:0.35,max:0.35,col:'#ffffff',size:3,g:0});
  if(P.buffer>0){P.buffer=0;flip();}
}
function updatePlayer(dt){
  var wx=camX+px();
  if(P.grounded){
    if(!solidAt(P.g>0?'floor':'ceil',wx+6,wx+PS-6)){P.grounded=false;P.coyote=0.07;}
  }
  if(!P.grounded){
    P.coyote-=dt;P.buffer-=dt;
    P.vy=clamp(P.vy+G*P.g*dt,-VMAX,VMAX);
    var ny=P.y+P.vy*dt;
    if(P.g>0&&ny>=FLOOR-PS&&P.y<=FLOOR-PS+1&&solidAt('floor',wx+6,wx+PS-6))land(FLOOR-PS);
    else if(P.g<0&&ny<=CEIL&&P.y>=CEIL-1&&solidAt('ceil',wx+6,wx+PS-6))land(CEIL);
    else P.y=ny;
  }
}
function collide(){
  var wx=camX+px(),ax=wx+4,bx=wx+PS-4,ay=P.y+4,by=P.y+PS-4,i,j,o;
  for(i=0;i<obs.length;i++){o=obs[i];
    if(o.x>bx+10||o.x+o.w<ax-10)continue;
    if(o.type==='spike'){
      for(j=0;j<o.n;j++){var sx=o.x+j*SPW+9,ex=sx+16;if(bx<sx||ax>ex)continue;
        if(o.side==='floor'?by>FLOOR-22:ay<CEIL+22){die();return;}}
    } else if(o.type==='wall'){
      var top=wallTop(o);
      if(bx>o.x+2&&ax<o.x+o.w-2&&by>top+2&&ay<top+o.h-2){die();return;}
    }
  }
  // fell into a pit and hit its far wall, or fell out of the world
  if(P.y>FLOOR-PS+6&&solidAt('floor',wx+6,wx+PS-6)){die();return;}
  if(P.y<CEIL-6&&solidAt('ceil',wx+6,wx+PS-6)){die();return;}
  if(P.y>H+80||P.y<-80-PS){die();return;}
}
function die(){
  if(state!=='play')return;
  state='dead';deadAt=t;shake=18;flash=1;
  var cx=camX+px()+PS/2,cy=P.y+PS/2;
  burst(cx,cy,46,skinCol(skinIdx),620,0.9,900,7);
  burst(cx,cy,18,'#ffffff',420,0.5,600,4);
  burst(cx,cy,14,'#ff3b6b',300,0.7,700,5);
  beep(180,0.35,'sawtooth',0.06,-140);beep(90,0.45,'square',0.04,-50);
  newBest=score>runBestBefore&&score>0;
  if(score>best){best=score;store.set('flipfall_best',best);}
  try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}
}
function checkUnlock(){
  for(var i=1;i<SKINS.length;i++){
    if(!announced[i]&&score>=SKINS[i].need&&runBestBefore<SKINS[i].need){
      announced[i]=1;toast={text:'NEW SKIN UNLOCKED: '+SKINS[i].name,life:2.4};beep(880,0.15,'triangle',0.05,440);
    }
  }
}

// ---------- update ----------
function step(dt){
  if(state==='play'){
    speed=330+Math.min(470,camX*0.011);
    camX+=speed*dt;score=Math.floor(camX/40);
    while(nextX<camX+W+300)spawn();
    updatePlayer(dt);collide();checkUnlock();
  } else if(state==='menu'){
    camX+=220*dt;demoFlip-=dt;
    if(demoFlip<=0){demoFlip=1.4;flipSilent();}
    updatePlayer(dt);
  }
}
function flipSilent(){if(P.grounded){P.g*=-1;P.grounded=false;P.vy=KICK*P.g;P.sx=0.7;P.sy=1.35;}}

function update(dt){
  var n=Math.ceil(dt/(1/120)),sd=dt/n,i;
  for(i=0;i<n;i++)step(sd);
  // cosmetics
  P.vis+=(P.g-P.vis)*Math.min(1,dt*16);
  P.sx+=(1-P.sx)*Math.min(1,dt*12);P.sy+=(1-P.sy)*Math.min(1,dt*12);
  P.tilt+=((P.grounded?0:clamp(P.vy/VMAX,-1,1)*0.35*P.g)-P.tilt)*Math.min(1,dt*10);
  if(state!=='dead'){
    trail.push({x:camX+px()+PS/2,y:P.y+PS/2});if(trail.length>16)trail.shift();
    if(state==='play'&&SKINS[skinIdx].name==='EMBER'&&Math.random()<0.5)
      parts.push({x:camX+px()+4,y:P.y+PS/2+(Math.random()-0.5)*PS*0.6,vx:-60,vy:-40*P.g,life:0.4,max:0.4,col:Math.random()<0.5?'#ffcf3a':'#ff5a1e',size:4,g:-200*P.g});
    if(state==='play'&&SKINS[skinIdx].name==='TOXIC'&&Math.random()<0.15)
      parts.push({x:camX+px()+PS/2,y:P.y+(P.g>0?PS:0),vx:-30,vy:30*P.g,life:0.6,max:0.6,col:'#9dff3a',size:3,g:500*P.g});
  } else if(trail.length)trail.shift();
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*1.5;}
  if(parts.length>400)parts.splice(0,parts.length-400);
  shake=Math.max(0,shake-dt*45);flash=Math.max(0,flash-dt*3);
  if(toast){toast.life-=dt;if(toast.life<=0)toast=null;}
  for(i=0;i<4;i++)boxWiggle[i]=Math.max(0,boxWiggle[i]-dt*3);
  if(state==='play')obs=obs.filter(function(o){return o.x+o.w>camX-120;});
}

// ---------- drawing ----------
var stars=[];for(var si=0;si<90;si++)stars.push({x:Math.random()*2400,y:-300+Math.random()*1200,s:Math.random()*2+0.5,l:0.05+Math.random()*0.25});
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(s,x,y,size,col,align,weight){ctx.font=(weight||900)+' '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y);}
var BG='#0b0820';
function screenTop(){return -oy/scale;} function screenBot(){return (ch-oy)/scale;}

function drawBackground(){
  var g=ctx.createLinearGradient(0,screenTop(),0,screenBot());
  g.addColorStop(0,'#120a33');g.addColorStop(0.5,'#1b0f45');g.addColorStop(1,'#0b0820');
  ctx.fillStyle=g;ctx.fillRect(-50,screenTop()-50,W+100,screenBot()-screenTop()+100);
  for(var i=0;i<stars.length;i++){var s=stars[i],x=((s.x-camX*s.l)%2400+2400)%2400;
    if(x>W+5)continue;ctx.globalAlpha=0.35+s.l*2;ctx.fillStyle='#bfb6ff';ctx.fillRect(x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
  // perspective grid lines
  ctx.strokeStyle='rgba(140,90,255,0.10)';ctx.lineWidth=1;
  var off=(camX*0.5)%80;ctx.beginPath();
  for(var gx=-off;gx<W+80;gx+=80){ctx.moveTo(gx,CEIL);ctx.lineTo(gx,FLOOR);}
  for(var gy=CEIL+60;gy<FLOOR;gy+=60){ctx.moveTo(0,gy);ctx.lineTo(W,gy);}
  ctx.stroke();
}
function drawCorridor(){
  var top=screenTop()-30,bot=screenBot()+30,i,o,x;
  // bands
  ctx.fillStyle='#2a1866';ctx.fillRect(-20,top,W+40,CEIL-top);ctx.fillRect(-20,FLOOR,W+40,bot-FLOOR);
  // stripes
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=6;ctx.beginPath();
  var off=camX%40;
  for(x=-off-40;x<W+40;x+=40){ctx.moveTo(x,FLOOR+8);ctx.lineTo(x+24,FLOOR+40);ctx.moveTo(x,CEIL-8);ctx.lineTo(x+24,CEIL-40);}
  ctx.stroke();
  // neon edges
  ctx.shadowColor='#c04bff';ctx.shadowBlur=14;ctx.fillStyle='#e07bff';
  ctx.fillRect(-20,FLOOR,W+40,4);ctx.fillRect(-20,CEIL-4,W+40,4);ctx.shadowBlur=0;
  // gaps
  for(i=0;i<obs.length;i++){o=obs[i];if(o.type!=='gap')continue;x=o.x-camX;if(x>W+20||x+o.w<-20)continue;
    var y0=o.side==='floor'?FLOOR-0.5:top,y1=o.side==='floor'?bot:CEIL+0.5;
    var g=ctx.createLinearGradient(0,o.side==='floor'?FLOOR:CEIL,0,o.side==='floor'?FLOOR+120:CEIL-120);
    g.addColorStop(0,'#05030f');g.addColorStop(1,'#000000');
    ctx.fillStyle=g;ctx.fillRect(x,y0,o.w,y1-y0);
    ctx.fillStyle='rgba(255,59,107,0.85)';
    var ey=o.side==='floor'?FLOOR:CEIL-40;ctx.fillRect(x-3,ey,3,40);ctx.fillRect(x+o.w,ey,3,40);
  }
}
function drawObstacles(){
  for(var i=0;i<obs.length;i++){var o=obs[i],x=o.x-camX;if(x>W+20||x+o.w<-20)continue;
    if(o.type==='spike'){
      ctx.fillStyle='#ff3b6b';ctx.shadowColor='#ff3b6b';ctx.shadowBlur=12;ctx.beginPath();
      for(var j=0;j<o.n;j++){var sx=x+j*SPW;
        if(o.side==='floor'){ctx.moveTo(sx,FLOOR);ctx.lineTo(sx+SPW/2,FLOOR-30);ctx.lineTo(sx+SPW,FLOOR);}
        else{ctx.moveTo(sx,CEIL);ctx.lineTo(sx+SPW/2,CEIL+30);ctx.lineTo(sx+SPW,CEIL);}}
      ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();
      for(j=0;j<o.n;j++){sx=x+j*SPW;
        if(o.side==='floor'){ctx.moveTo(sx+6,FLOOR);ctx.lineTo(sx+SPW/2,FLOOR-30);ctx.lineTo(sx+SPW/2-2,FLOOR);}
        else{ctx.moveTo(sx+6,CEIL);ctx.lineTo(sx+SPW/2,CEIL+30);ctx.lineTo(sx+SPW/2-2,CEIL);}}
      ctx.fill();
    } else if(o.type==='wall'){
      var top=wallTop(o);
      ctx.strokeStyle='rgba(255,180,60,0.25)';ctx.lineWidth=2;ctx.setLineDash([6,8]);
      ctx.beginPath();ctx.moveTo(x+o.w/2,CEIL);ctx.lineTo(x+o.w/2,FLOOR);ctx.stroke();ctx.setLineDash([]);
      ctx.shadowColor='#ffb43c';ctx.shadowBlur=16;ctx.fillStyle='#ff9d2e';rr(x,top,o.w,o.h,8);ctx.fill();ctx.shadowBlur=0;
      ctx.save();rr(x,top,o.w,o.h,8);ctx.clip();ctx.fillStyle='rgba(40,10,0,0.45)';
      for(var yy=top-40+((t*60)%40);yy<top+o.h;yy+=40){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+o.w,yy+20);ctx.lineTo(x+o.w,yy+34);ctx.lineTo(x,yy+14);ctx.fill();}
      ctx.restore();
    }
  }
}
function drawCube(cx,cy,size,skin,vis,sx,sy,tilt){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt||0);ctx.scale(sx,sy*vis);
  var col=skinCol(skin),h=size/2;
  ctx.shadowColor=col;ctx.shadowBlur=18;ctx.fillStyle=col;rr(-h,-h,size,size,size*0.22);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle=SKINS[skin].dark;ctx.globalAlpha=0.35;rr(-h,h*0.25,size,h*0.75,size*0.2);ctx.fill();ctx.globalAlpha=1;
  if(SKINS[skin].name==='TOXIC'){ctx.fillStyle='rgba(20,60,0,0.4)';ctx.beginPath();ctx.arc(-h*0.45,h*0.5,size*0.1,0,7);ctx.arc(h*0.1,-h*0.6,size*0.07,0,7);ctx.fill();}
  // eyes
  ctx.fillStyle='#fff';rr(h*0.02,-h*0.5,size*0.22,size*0.3,3);ctx.fill();rr(h*0.55,-h*0.5,size*0.22,size*0.3,3);ctx.fill();
  ctx.fillStyle='#120a33';ctx.fillRect(h*0.18,-h*0.38,size*0.1,size*0.16);ctx.fillRect(h*0.71,-h*0.38,size*0.1,size*0.16);
  if(SKINS[skin].name==='EMBER'){ctx.fillStyle='#120a33';ctx.fillRect(-h*0.05,-h*0.62,size*0.3,size*0.06);ctx.fillRect(h*0.5,-h*0.62,size*0.3,size*0.06);}
  ctx.restore();
}
function drawPlayer(){
  if(state==='dead')return;
  for(var i=0;i<trail.length;i++){var p=trail[i],a=(i+1)/trail.length,sz=PS*0.75*a;
    ctx.globalAlpha=a*0.45;ctx.fillStyle=skinCol(skinIdx,i*20);
    ctx.fillRect(p.x-camX-sz/2,p.y-sz/2,sz,sz);}
  ctx.globalAlpha=1;
  drawCube(px()+PS/2,P.y+PS/2,PS,skinIdx,P.vis,P.sx,P.sy,P.tilt);
}
function drawParticles(){
  for(var i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;
    ctx.fillRect(p.x-camX-p.size/2,p.y-p.size/2,p.size,p.size);}
  ctx.globalAlpha=1;
}
function skinRects(){var bw=84,bh=100,gap=16,tot=4*bw+3*gap,x0=W/2-tot/2,r=[];
  for(var i=0;i<4;i++)r.push({x:x0+i*(bw+gap),y:318,w:bw,h:bh});return r;}
function menuBtn(){return {x:W/2-80,y:420,w:160,h:46};}
function muteBtn(){return {x:10+safeL/scale,y:8+Math.max(0,safeT-oy)/scale,w:46,h:46};}
function drawMute(){
  var b=muteBtn(),cx=b.x+b.w/2,cy=b.y+b.h/2;
  ctx.fillStyle='rgba(11,8,32,0.6)';rr(b.x,b.y,b.w,b.h,12);ctx.fill();
  ctx.strokeStyle='rgba(224,123,255,0.8)';ctx.lineWidth=2;rr(b.x,b.y,b.w,b.h,12);ctx.stroke();
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(cx-13,cy-5);ctx.lineTo(cx-7,cy-5);ctx.lineTo(cx,cy-12);ctx.lineTo(cx,cy+12);ctx.lineTo(cx-7,cy+5);ctx.lineTo(cx-13,cy+5);ctx.closePath();ctx.fill();
  ctx.strokeStyle=muted?'#ff3b6b':'#ffffff';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();
  if(muted){ctx.moveTo(cx+4,cy-6);ctx.lineTo(cx+14,cy+6);ctx.moveTo(cx+14,cy-6);ctx.lineTo(cx+4,cy+6);}
  else{ctx.arc(cx+2,cy,6,-0.9,0.9);ctx.moveTo(cx+2+11*Math.cos(-0.9),cy+11*Math.sin(-0.9));ctx.arc(cx+2,cy,11,-0.9,0.9);}
  ctx.stroke();ctx.lineCap='butt';
}
function toggleMute(){muted=!muted;store.set('flipfall_muted',muted);if(!muted)beep(700,0.06,'triangle',0.04);
  try{if(actx){if(muted)actx.suspend();else actx.resume();}}catch(e){}}
function inR(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}

function drawMenu(){
  ctx.fillStyle='rgba(8,4,24,0.45)';ctx.fillRect(0,CEIL,W,FLOOR-CEIL);
  // title: FLIP + upside-down FALL
  ctx.font='900 78px '+FONT;var w1=ctx.measureText('FLIP').width,w2=ctx.measureText('FALL').width,tx=W/2-(w1+w2)/2;
  var bob=Math.sin(t*3)*4;
  ctx.shadowColor='#3ef2ff';ctx.shadowBlur=20;text('FLIP',tx,150+bob,78,'#3ef2ff','left');
  ctx.save();ctx.translate(tx+w1,150-bob);ctx.scale(1,-1);ctx.shadowColor='#ff3b6b';text('FALL',0,0,78,'#ff3b6b','left');ctx.restore();
  ctx.shadowBlur=0;
  ctx.globalAlpha=0.6+0.4*Math.sin(t*5);text('TAP TO FLIP',W/2,232,30,'#ffffff');ctx.globalAlpha=1;
  text('BEST  '+best+' m',W/2,272,18,'#bfb6ff','center',700);
  var rs=skinRects();
  for(var i=0;i<4;i++){var r=rs[i],ok=unlocked(i),sel=i===skinIdx,wx=Math.sin(t*40)*boxWiggle[i]*6;
    ctx.save();ctx.translate(wx,0);
    ctx.fillStyle=sel?'rgba(62,242,255,0.18)':'rgba(255,255,255,0.06)';rr(r.x,r.y,r.w,r.h,12);ctx.fill();
    ctx.lineWidth=sel?3:1.5;ctx.strokeStyle=sel?'#3ef2ff':'rgba(255,255,255,0.25)';rr(r.x,r.y,r.w,r.h,12);ctx.stroke();
    if(ok){drawCube(r.x+r.w/2,r.y+40,34,i,1,1,1,0);text(SKINS[i].name,r.x+r.w/2,r.y+82,13,sel?'#ffffff':'#bfb6ff','center',800);}
    else{ctx.globalAlpha=0.5;ctx.fillStyle='#444';rr(r.x+r.w/2-17,r.y+23,34,34,7);ctx.fill();ctx.globalAlpha=1;
      // lock icon
      ctx.strokeStyle='#bfb6ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x+r.w/2,r.y+36,6,Math.PI,0);ctx.stroke();
      ctx.fillStyle='#bfb6ff';ctx.fillRect(r.x+r.w/2-9,r.y+36,18,13);
      text(SKINS[i].need+' m',r.x+r.w/2,r.y+82,13,'#8f86c9','center',800);}
    ctx.restore();
  }
  text('Tap · Click · Space to flip   ·   S to mute   ·   pick a skin above',W/2,452,14,'rgba(191,182,255,0.7)','center',600);
}
function drawHUD(){
  text(score+' m',W/2,108,44,'rgba(255,255,255,0.92)');
  text('BEST '+Math.max(best,score),W-16,90,16,'#bfb6ff','right',800);
  if(toast){ctx.globalAlpha=Math.min(1,toast.life*2);
    ctx.font='900 18px '+FONT;var tw=ctx.measureText(toast.text).width+36;
    ctx.fillStyle='rgba(20,10,50,0.85)';rr(W/2-tw/2,148,tw,38,19);ctx.fill();ctx.strokeStyle='#ffd23a';ctx.lineWidth=2;rr(W/2-tw/2,148,tw,38,19);ctx.stroke();
    text(toast.text,W/2,167,18,'#ffd23a');ctx.globalAlpha=1;}
}
function drawDead(){
  var k=Math.min(1,(t-deadAt)/0.25);
  ctx.fillStyle='rgba(8,4,24,'+(0.55*k)+')';ctx.fillRect(0,CEIL,W,FLOOR-CEIL);
  ctx.globalAlpha=k;
  text('CRASHED',W/2,170,40,'#ff3b6b');
  text(score+' m',W/2,245,72,'#ffffff');
  if(newBest){ctx.globalAlpha=k*(0.7+0.3*Math.sin(t*8));text('NEW BEST!',W/2,305,22,'#ffd23a');ctx.globalAlpha=k;}
  else text('BEST '+best+' m',W/2,305,20,'#bfb6ff','center',700);
  ctx.globalAlpha=k*(0.6+0.4*Math.sin(t*5));text('TAP TO RETRY',W/2,370,26,'#ffffff');ctx.globalAlpha=k;
  var b=menuBtn();ctx.fillStyle='rgba(255,255,255,0.08)';rr(b.x,b.y,b.w,b.h,23);ctx.fill();
  ctx.strokeStyle='rgba(191,182,255,0.6)';ctx.lineWidth=2;rr(b.x,b.y,b.w,b.h,23);ctx.stroke();
  text('SKINS / MENU',b.x+b.w/2,b.y+b.h/2,15,'#bfb6ff','center',800);
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=BG;ctx.fillRect(0,0,cv.width,cv.height);
  var sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,sx*scale*dpr,(oy+sy*scale)*dpr);
  drawBackground();drawCorridor();drawObstacles();drawParticles();drawPlayer();
  if(state==='play')drawHUD();else if(state==='menu')drawMenu();else drawDead();
  drawMute();
  if(flash>0){ctx.globalAlpha=flash*0.6;ctx.fillStyle='#ffffff';ctx.fillRect(-50,screenTop()-50,W+100,screenBot()-screenTop()+100);ctx.globalAlpha=1;}
}

// ---------- input ----------
function press(lx,ly){
  var mb=muteBtn();if(ly!==null&&inR(lx,ly,{x:mb.x-8,y:mb.y-10,w:mb.w+16,h:mb.h+16})){toggleMute();return;}   // generous touch target
  if(state==='menu'){
    var rs=skinRects();
    for(var i=0;i<rs.length;i++)if(inR(lx,ly,rs[i])){
      if(unlocked(i)){skinIdx=i;store.set('flipfall_skin',i);beep(700,0.06,'triangle',0.04);}
      else{boxWiggle[i]=1;beep(140,0.12,'square',0.04);}
      return;}
    start();return;
  }
  if(state==='play'){flip();return;}
  if(state==='dead'){
    if(t-deadAt<0.3)return;            // ignore the panic-tap that caused the death
    if(ly!==null&&inR(lx,ly,menuBtn())){reset();state='menu';demoFlip=1;return;}
    start();
  }
}
function toLogical(cx,cy){return [cx/scale,(cy-oy)/scale];}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.focus({preventScroll:true});}catch(_){}
  var l=toLogical(e.clientX,e.clientY);press(l[0],l[1]);},{passive:false});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(function(ev){
  document.addEventListener(ev,function(e){if(e.cancelable)e.preventDefault();},{passive:false});});
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '||k==='Spacebar'||k==='Enter'||k==='ArrowUp'||k==='ArrowDown'||k==='w'){
    e.preventDefault();if(e.repeat)return;press(-1,null);
  } else if(state==='menu'&&(k==='ArrowLeft'||k==='ArrowRight')){
    e.preventDefault();var d=k==='ArrowLeft'?-1:1,n=skinIdx;
    for(var i=0;i<4;i++){n=(n+d+4)%4;if(unlocked(n))break;}
    skinIdx=n;store.set('flipfall_skin',n);beep(700,0.06,'triangle',0.04);
  } else if(k==='s'||k==='S'){e.preventDefault();if(!e.repeat)toggleMute();
  } else if((k==='Escape'||k==='m'||k==='M')&&state==='dead'){reset();state='menu';}
});

// ---------- loop ----------
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  t+=dt;update(dt);draw();requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
// small read-only hook for automated testing
window.__flipfall={get state(){return state;},get score(){return score;},get best(){return best;},get obstacles(){return obs.length;},get muted(){return muted;},get gravity(){return P.g;}};
})();
</script>
