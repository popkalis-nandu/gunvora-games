<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prestige GP: Absolute Chaos</title>
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#e9e4d8;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:10px;left:12px;font-size:clamp(11px,1.8vmin,16px);letter-spacing:.12em;text-transform:uppercase;line-height:1.6;text-shadow:0 1px 4px #000}
#hud b{color:#d4af6a;font-size:1.6em}
#wbtn,#pbtn{position:fixed;top:10px;padding:8px 12px;background:rgba(10,12,20,.75);border:1px solid #d4af6a;color:#d4af6a;font:600 12px system-ui;letter-spacing:.15em;border-radius:4px}
#wbtn{right:12px}#pbtn{right:120px}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#141826,#05060a);text-align:center;z-index:5}
.ov h1{font-weight:300;letter-spacing:.3em;font-size:clamp(20px,5vmin,48px);margin:0;color:#f3ead6}
.ov h2{color:#d4af6a;letter-spacing:.5em;font-weight:400;font-size:clamp(11px,2vmin,16px)}
.ov p{opacity:.75;max-width:520px;font-size:13px;line-height:1.6;padding:0 16px}
.ov button{margin-top:14px;padding:12px 34px;background:#d4af6a;color:#111;border:0;font:700 14px system-ui;letter-spacing:.3em;border-radius:3px}
.hide{display:none!important}
.tc{position:fixed;bottom:14px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(212,175,106,.5);color:#d4af6a;font:700 22px system-ui;display:flex;align-items:center;justify-content:center}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div>
<button id="pbtn">PAUSE</button><button id="wbtn">WEATHER</button>
<div id="tch" class="hide">
<div class="tc" id="tl" style="left:14px">◀</div><div class="tc" id="tr" style="left:96px">▶</div>
<div class="tc" id="tb" style="right:96px">■</div><div class="tc" id="tg" style="right:14px">▲</div></div>
<div class="ov" id="title"><h2>PRESTIGE GP</h2><h1>ABSOLUTE CHAOS</h1><h2>NIGHT STREET CIRCUIT</h2>
<p>WASD / Arrows to drive · Q or the WEATHER button cycles weather · Esc / P pauses.<br>Rain builds slowly — the track takes over a minute to soak. Wet tarmac loses up to 45% grip.</p>
<button id="go">START RACE</button></div>
<div class="ov hide" id="pause"><h1>PAUSED</h1><button id="res">RESUME</button></div>
<script src="game.js"></script></body></html>
