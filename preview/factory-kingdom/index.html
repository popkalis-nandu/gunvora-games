<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='%234338ca'/%3E%3Cpath d='M12 50V30l12 8V30l12 8V18h8v32z' fill='%23fff'/%3E%3Ccircle cx='48' cy='14' r='5' fill='%23f97316'/%3E%3C/svg%3E">
<style>
/* Factory Kingdom 250 · GUNVORA GAMES — matches site palette (indigo #4338ca + orange #f97316) */
:root{
  --primary:#4338ca;--primary-600:#4f46e5;--primary-700:#3730a3;--primary-50:#eef2ff;--primary-100:#e0e7ff;
  --accent:#f97316;--accent-600:#ea580c;--gold:#f59e0b;--green:#059669;--red:#dc2626;
  --bg:#f6f7fb;--surface:#fff;--surface-2:#f1f3f9;--line:#e3e7f0;--text:#0f172a;--text-2:#334155;--muted:#5b6478;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --display:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1e1b4b;font:14px/1.4 var(--font);color:var(--text);overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.45);overflow:hidden;user-select:none;-webkit-user-select:none}

/* HUD */
#hud{background:linear-gradient(135deg,var(--primary-700),var(--primary-600) 60%,#6d28d9);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;flex-shrink:0;position:relative;z-index:3}
.hud-top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px}
.mark{border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bt{display:flex;flex-direction:column;line-height:1}
.bt small{font-size:9px;letter-spacing:.22em;font-weight:700;color:#c7d2fe;margin-bottom:3px}
.bt b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em}
.bt b i{font-style:normal;color:#fdba74}
.hud-right{display:flex;align-items:center;gap:8px}
.free{background:linear-gradient(135deg,#34d399,#059669);font-weight:800;font-size:11px;letter-spacing:.1em;padding:4px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(5,150,105,.5)}
.icon-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);font-size:18px;color:#fff}
.lvl-title{display:block;margin:7px 0 6px;color:#fff;font-family:var(--display);font-weight:800;font-size:16px;text-align:left}
.lvl-title span{font-size:11px;opacity:.75}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:rgba(255,255,255,.13);border-radius:12px;padding:5px 9px}
.stat small{display:block;font-size:10px;color:#c7d2fe;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-size:16px;font-weight:800;display:flex;align-items:center;gap:5px;transition:transform .15s}
.stat b.bump{transform:scale(1.18);color:#fde68a}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#fbbf24 45%,#d97706);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex-shrink:0}
.prog{margin-top:7px}
.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:#c7d2fe;font-weight:600;margin-bottom:3px}
.bar{height:9px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fbbf24,var(--accent));border-radius:9px;transition:width .4s}
.goals{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.goal{font-size:11px;font-weight:700;background:rgba(255,255,255,.95);color:var(--primary-700);padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:4px}
.goal.done{background:#bbf7d0;color:#065f46}

/* Scene */
#scene-wrap{position:relative;flex:1 1 auto;min-height:180px;background:#8fd16b;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#toasts{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.toast{background:rgba(15,23,42,.86);color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px;animation:tin .25s ease-out;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.good{background:rgba(5,150,105,.95)}.toast.bad{background:rgba(220,38,38,.95)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Panel */
#panel{flex:0 0 38%;min-height:200px;background:var(--surface);border-top:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:2;box-shadow:0 -8px 20px -10px rgba(15,23,42,.25)}
#panelBody{padding:10px 10px 14px}
.ph{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 8px}
.ph h3{font-family:var(--display);font-size:15px;font-weight:800;color:var(--primary-700)}
.ph small{color:var(--muted);font-weight:600}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1;min-width:0}
.ttl{font-weight:800;font-size:13.5px}
.sub{color:var(--muted);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--primary-50);color:var(--primary-700)}
.chip.warn{background:#fff7ed;color:#c2410c}.chip.bad{background:#fee2e2;color:#b91c1c}.chip.ok{background:#dcfce7;color:#166534}
.mini-bar{height:6px;border-radius:6px;background:#e2e8f0;overflow:hidden;margin-top:5px}
.mini-bar i{display:block;height:100%;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 12px;border-radius:11px;font-weight:800;font-size:12.5px;color:#fff;background:var(--primary-600);box-shadow:0 3px 0 var(--primary-700);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--primary-700)}
.btn.acc{background:linear-gradient(135deg,#f59e0b,var(--accent));box-shadow:0 3px 0 #c2410c}
.btn.grn{background:var(--green);box-shadow:0 3px 0 #065f46}
.btn.red{background:var(--red);box-shadow:0 3px 0 #991b1b}
.btn.ghost{background:#fff;color:var(--text-2);border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.btn[disabled]{background:#cbd5e1!important;color:#f8fafc;box-shadow:0 3px 0 #94a3b8!important;cursor:not-allowed}
.btn.sm{padding:6px 9px;font-size:11.5px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.lock{opacity:.6}
.icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:#fff;border:1px solid var(--line);flex-shrink:0}
.sel{font:inherit;font-size:12px;font-weight:700;padding:5px 6px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text)}
.teaser{background:linear-gradient(135deg,#1e1b4b,#4338ca);color:#fff;border:0}
.teaser .sub{color:#c7d2fe}
.prem{background:linear-gradient(135deg,#7c2d12,#f97316);color:#fff;border:0}
.prem .sub{color:#ffedd5}
.empty{text-align:center;color:var(--muted);padding:16px 8px;font-weight:600}
.timer{font-variant-numeric:tabular-nums}

/* Tabs */
#tabs{display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;position:relative;z-index:3}
#tabs button{padding:6px 0 7px;font-size:10px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#tabs button span{font-size:18px;line-height:1.2;filter:grayscale(.6)}
#tabs button.on{color:var(--primary-700);background:var(--primary-50)}
#tabs button.on span{filter:none}
#tabs em{position:absolute;top:3px;right:calc(50% - 20px);background:var(--accent);color:#fff;font-style:normal;font-size:10px;min-width:16px;height:16px;line-height:16px;border-radius:8px;padding:0 3px}
#tabs em:empty{display:none}
#tabs button.pulse{animation:tp 1s ease-in-out infinite}
@keyframes tp{50%{background:#ffedd5}}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:18px;animation:fin .2s}
#modal.hidden,#tut.hidden{display:none}
@keyframes fin{from{opacity:0}}
.mbox{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:88%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mbox h2{font-family:var(--display);font-weight:800;font-size:22px;text-align:center;color:var(--primary-700);margin-bottom:4px}
.mbox .big{font-size:46px;text-align:center;line-height:1.1}
.mbox p{color:var(--text-2);text-align:center;margin:6px 0}
.mbox .btn{width:100%;padding:12px;font-size:15px;margin-top:8px}
.lvlist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.lv{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.lv.done{background:#dcfce7;color:#166534;border-color:#86efac}
.lv.cur{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 3px #fed7aa}
.lv.lk{font-size:13px}
.rewards{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.rewards div{background:var(--primary-50);color:var(--primary-700);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}

/* Tutorial */
#tut{position:absolute;inset:0;z-index:15;pointer-events:none}
#tutRing{position:absolute;border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 4000px rgba(15,23,42,.45),0 0 18px var(--accent);transition:all .3s;animation:ring 1.1s ease-in-out infinite}
@keyframes ring{50%{border-color:#fde68a}}
#tutBox{position:absolute;left:14px;right:14px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);pointer-events:auto;font-size:13.5px;color:var(--text-2)}
#tutBox b{color:var(--primary-700)}
#tutBox .tn{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
#tutBox .tn small{color:var(--muted);font-weight:700}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (min-width:700px){#app{border-radius:0}}
@media (max-height:640px){.goals{display:none}#panel{flex-basis:36%}}

</style>
</head>

          '<div class="mini-bar"><i style="width:' + Math.round(f * 100) + "%;background:" + (f < 0.25 ? "#ef4444" : f < 0.5 ? "#f59e0b" : "#22c55e") + '"></i></div></div>';
      });
      return h;
    }
  };
  function teaser() {
    return '<div class="card teaser"><div class="row"><div class="icon" style="background:rgba(255,255,255,.15);border:0">🔒</div><div class="grow"><div class="ttl">Levels 11–50 · FREE</div><div class="sub">Bigger workshops, more product lines, multiple machines and your first full factory. Coming in a future update.</div></div></div></div>' +
      '<div class="card prem"><div class="row"><div class="icon" style="background:rgba(255,255,255,.18);border:0">👑</div><div class="grow"><div class="ttl">Premium Levels 51–250</div><div class="sub">Printing &amp; packaging lines, export orders, robotics, smart factories and a global empire. Planned for GUNVORA Premium. Not available in this prototype, and there are no payments here.</div></div></div></div>';
  }
  function renderPanel(force) {
    if (pointerDown && !force) return;
    var ae = document.activeElement; if (!force && ae && ae.tagName === "SELECT" && $("panel").contains(ae)) return;
    var h = PANELS[tab]();
    if (h !== lastPanel || force) { var sc = $("panel").scrollTop; $("panelBody").innerHTML = h; $("panel").scrollTop = sc; lastPanel = h; }
  }
  function setTab(t) {
    tab = t; document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === t); });
    $("panel").scrollTop = 0; renderPanel(true); hud(); sfx.tap(); tutCheck();
  }
  document.querySelectorAll("#tabs button").forEach(function (b) { b.addEventListener("click", function () { setTab(b.dataset.tab); }); });
  $("panel").addEventListener("pointerdown", function () { pointerDown = true; });
  window.addEventListener("pointerup", function () { setTimeout(function () { pointerDown = false; }, 60); });
  window.addEventListener("pointercancel", function () { pointerDown = false; });
  $("panelBody").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b || b.disabled) return;
    var a = b.dataset.act, g = b.dataset.arg;
    if (a === "buyRaw") { var p = g.split(":"); A.buyRaw(p[0], +p[1]); }
    else if (a === "toggle") A.toggle(+g);
    else if (a === "service") A.service(+g);
    else if (a === "repair") A.repair(+g);
    else if (a === "upMachine") A.upgradeMachine(+g);
    else if (a === "buyMachine") A.buyMachine();
    else if (a === "hire") A.hire();
    else if (a === "expand") A.expand();
    else if (a === "conveyor") A.conveyor();
    else if (a === "vehicle") A.vehicle();
    else if (a === "ship") A.ship(+g);
    pointerDown = false; renderPanel(true); hud(); tutCheck(); save();
  });
  $("panelBody").addEventListener("change", function (e) {
    var s = e.target; if (!s.dataset.act) return;
    if (s.dataset.act === "product") A.setProduct(+s.dataset.arg, s.value);
    if (s.dataset.act === "assign") A.assign(+s.dataset.arg, s.value);
    s.blur(); pointerDown = false; renderPanel(true); save();
  });

  /* ---------------- modals ---------------- */
  function modal(html) { $("modal").innerHTML = '<div class="mbox">' + html + "</div>"; $("modal").classList.remove("hidden"); modalOpen = true; }
  function closeModal() { $("modal").classList.add("hidden"); modalOpen = false; }
  $("modal").addEventListener("click", function (e) {
    var b = e.target.closest("[data-m]"); if (!b) { if (e.target.id === "modal" && !S.pendingLevelUp) closeModal(); return; }
    var a = b.dataset.m; sfx.tap();
    if (a === "close") closeModal();
    if (a === "next") { closeModal(); advanceLevel(); }
    if (a === "map") levelMap();
    if (a === "sound") { S.sound = !S.sound; save(); menu(); }
    if (a === "tut") { closeModal(); S.tut = 0; if (S.level !== 1) toast("The tutorial runs on Level 1. Tips are in each tab."); tutShow(); }
    if (a === "reset") { if (confirm("Erase all Factory Kingdom progress on this device?")) { localStorage.removeItem(D.saveKey); S = fresh(); belt = []; closeModal(); setTab("machines"); tutShow(); } }
  });
  function showLevelUp() {
    var l = L(), nl = D.levels[l.n];
    sfx.level(); confetti(150); coinFly(200, 200, 12);
    if (l.n < 10) {
      modal('<div class="big">🏆</div><h2>Level ' + l.n + ' complete!</h2><p><b>' + l.title + '</b> done. Your factory is growing!</p>' +
        '<div class="rewards"><div>💰 Reward: +' + fmt(l.reward) + " coins</div>" + (nl.unlocks || []).map(function (u) { return "<div>🔓 " + u + "</div>"; }).join("") + "</div>" +
        '<p class="sub">Next up: <b>Level ' + nl.n + " · " + nl.title + "</b></p>" + '<button class="btn acc" data-m="next">Continue ▶</button>');
    } else {
      modal('<div class="big">👑</div><h2>Small Factory built!</h2><p>You turned a rented shed into a working factory and finished all 10 prototype levels.</p>' +
        '<div class="rewards"><div>💰 Milestone reward: +' + fmt(l.reward) + " coins</div><div>🏅 Badge: Factory Founder</div></div>" + teaser() +
        '<button class="btn acc" data-m="next">Keep building ▶</button>');
    }
  }
  function levelMap() {
    var h = '<h2>Level map</h2><p class="sub">Factory Kingdom 250 · prototype levels 1–10</p><div class="lvlist">', i;
    for (i = 1; i <= 10; i++) { var dn = i < S.level || S.allDone; h += '<div class="lv ' + (dn ? "done" : i === S.level ? "cur" : "") + '">' + (dn ? "✓" : i) + "</div>"; }
    for (i = 11; i <= 15; i++) h += '<div class="lv lk" title="Level ' + i + '">🔒</div>';
    h += "</div>" + D.levels.map(function (l) { return '<div class="sub" style="text-align:left;padding:2px 0">' + (l.n < S.level || S.allDone ? "✅" : l.n === S.level ? "▶️" : "⬜") + " <b>" + l.n + ".</b> " + l.title + "</div>"; }).join("");
    h += '<div style="margin-top:10px">' + teaser() + '</div><div class="card"><div class="ttl">Full game roadmap</div>' + D.roadmap.map(function (r) { return '<div class="sub">Levels <b>' + r[0] + "</b> · " + r[1] + "</div>"; }).join("") + "</div>";
    modal(h + '<button class="btn" data-m="close">Back to factory</button>');
  }
  function menu() {
    modal('<h2>Menu</h2><p class="sub">Factory Kingdom 250 · GUNVORA GAMES<br>Prototype build · Levels 1–10 free</p>' +
      '<button class="btn" data-m="map">🗺️ Level map</button><button class="btn ghost" data-m="sound">' + (S.sound ? "🔊 Sound: on" : "🔈 Sound: off") + '</button>' +
      '<button class="btn ghost" data-m="tut">🎓 Replay tutorial</button><button class="btn ghost" data-m="reset">🗑 Reset progress</button><button class="btn acc" data-m="close">Resume</button>' +
      '<p class="sub" style="margin-top:10px">Progress saves automatically on this device.</p>');
  }
  $("btnMenu").addEventListener("click", function () { sfx.tap(); menu(); });
  $("lvlTitle").addEventListener("click", function () { sfx.tap(); levelMap(); });

  /* ---------------- tutorial (level 1) ---------------- */
  var TUT = [
    { txt: "<b>Welcome to Factory Kingdom!</b> You rent a small shed with <b>1 Basic Press</b> and <b>2 workers</b>. Let's make toy cars and build an empire.", target: "scene", next: "Let's go" },
    { txt: "<b>Tap the machine</b> to switch it on. Ravi will run it and turn wood into toy cars.", target: "m0", wait: function () { return S.machines[0].on; } },
    { txt: "Great! Priya <b>carries finished toys</b> to the shelf. Tip: <b>tap a running machine</b> to speed it up ⚡", target: "shelf", next: "Next" },
    { txt: "Customers send orders with a <b>deadline</b>. Open the <b>Orders</b> tab.", target: "tab:orders", wait: function () { return tab === "orders"; } },
    { txt: "When you have enough toys, tap <b>🚚 Ship</b>. You get paid when the cart arrives. Buy more wood in <b>Inventory</b> when you run low.", target: "panel", next: "Got it" },
    { txt: "Finish the <b>goals</b> at the top to complete Level 1. Good luck, boss!", target: "goals", next: "Start building" }
  ];
  function tutRect(t) {
    var a = $("app").getBoundingClientRect(), r, p, q;
    if (t === "m0") { p = sceneToApp(SLOTS[0].x - 40, SLOTS[0].y - 72); q = sceneToApp(SLOTS[0].x + 44, SLOTS[0].y + 36); return { x: p.x, y: p.y, w: q.x - p.x, h: q.y - p.y }; }
    if (t === "shelf") { p = sceneToApp(SHELF_X - 8, 86); q = sceneToApp(SHELF_X + 58, bottomY()); return { x: p.x, y: p.y, w: q.x - p.x, h: q.y - p.y }; }
    if (t === "scene") r = cv.getBoundingClientRect();
    else if (t.indexOf("tab:") === 0) r = document.querySelector('#tabs [data-tab="' + t.slice(4) + '"]').getBoundingClientRect();
    else r = $(t).getBoundingClientRect();
    return { x: r.left - a.left, y: r.top - a.top, w: r.width, h: r.height };
  }
  function tutShow() {
    if (S.tut < 0 || S.tut >= TUT.length || S.level !== 1) { $("tut").classList.add("hidden"); if (S.tut >= TUT.length) S.tut = -1; return; }
    var st = TUT[S.tut], r = tutRect(st.target), ring = $("tutRing"), box = $("tutBox"), a = $("app").getBoundingClientRect();
    $("tut").classList.remove("hidden");
    ring.style.left = r.x - 4 + "px"; ring.style.top = r.y - 4 + "px"; ring.style.width = r.w + 8 + "px"; ring.style.height = r.h + 8 + "px";
    var html = st.txt + '<div class="tn"><small>' + (S.tut + 1) + " / " + TUT.length + ' · <a href="#" data-skip style="color:inherit">skip</a></small>' + (st.next ? '<button class="btn acc sm" data-tnext>' + st.next + "</button>" : "<small>👆 " + (st.target === "m0" ? "Tap the machine" : "Tap the highlight") + "</small>") + "</div>";
    if (box.innerHTML !== html) box.innerHTML = html;
    var bh = box.offsetHeight || 110, y;
    if (st.target === "scene") y = r.y + r.h - bh - 10;
    else if (st.target === "panel") y = r.y + 10;
    else y = (r.y + r.h / 2 < a.height / 2) ? r.y + r.h + 14 : r.y - bh - 14;
    box.style.top = Math.max(8, Math.min(a.height - bh - 8, y)) + "px";
  }
  function tutCheck() {
    if (S.tut < 0) return; var st = TUT[S.tut];
    if (st && st.wait && st.wait()) { S.tut++; save(); }
    tutShow();
  }
  $("tutBox").addEventListener("click", function (e) {
    if (e.target.closest("[data-tnext]")) { S.tut++; if (S.tut >= TUT.length) S.tut = -1; sfx.tap(); save(); tutShow(); }
    if (e.target.closest("[data-skip]")) { e.preventDefault(); S.tut = -1; save(); tutShow(); }
  });

  /* ---------------- loop ---------------- */
  var last = performance.now(), uiT = 0, saveT = 0;
  function frame(now) {
    var dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now; T += dt;
    var simDt = S.pendingLevelUp ? 0 : dt * SPEED, n = Math.ceil(simDt / 0.05);
    for (var i = 0; i < n; i++) step(simDt / n);
    if (S.pendingLevelUp) { floats.forEach(function (f) { f.life -= dt; }); }
    render();
    uiT += dt; if (uiT > 0.25 || uiDirty) { uiT = 0; uiDirty = false; hud(); renderPanel(); if (S.tut >= 0) tutCheck(); }
    saveT += dt; if (saveT > 3) { saveT = 0; save(); }
    requestAnimationFrame(frame);
  }

  S = load() || fresh();
  window.addEventListener("resize", function () { resize(); tutShow(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) save(); });
  window.addEventListener("pagehide", save);
  resize(); hud(); renderPanel(true);
  if (S.pendingLevelUp) setTimeout(showLevelUp, 300);
  setTimeout(tutShow, 80);
  requestAnimationFrame(frame);

  // test / debug hooks (used by the automated play-test; harmless for players)
  window.FK = {
    state: function () { return S; }, actions: A, data: D, belt: function () { return belt; },
    sim: function (sec) { var n = Math.ceil(sec / 0.05); for (var i = 0; i < n; i++) { if (S.pendingLevelUp) return true; step(0.05); } return S.pendingLevelUp; },
    levelPct: levelPct, advance: function () { closeModal(); advanceLevel(); }, setTab: setTab, tapMachine: function (i) { tapMachine(S.machines[i]); },
    setSpeed: function (s) { SPEED = s; }, save: save, headless: false
  };
})();

</script>
</body>
</html>
